<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ghost in the Reply</title>
<style>
:root{
  --bg:#0b0b10; --card:#12121a; --line:#2a2a3a; --fg:#f2f2f7; --dim:#a0a0b4;
  --mag:#ff3df0; --grn:#00e676; --amb:#ffd600; --red:#ff1744; --cyn:#00e5ff;
  --body:max(28px,1.7vw); --head:max(64px,4.6vw);
  --mono:ui-monospace,"DejaVu Sans Mono","Cascadia Mono",Menlo,Consolas,monospace;
  --sans:system-ui,"Segoe UI","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font:var(--body)/1.28 var(--sans)}

/* ---------- audience ---------- */
#frame{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr;gap:1.2vh;padding:2vh 3vw}
#top{display:flex;justify-content:space-between;align-items:center;min-height:calc(var(--body)*1.6)}
#dots{display:flex;gap:.7vw}
#dots i{width:1.1vw;min-width:14px;height:1.1vw;min-height:14px;border-radius:50%;background:var(--line)}
#dots i.on{background:var(--mag)}
#badge{font-weight:700;padding:.15em .7em;border-radius:999px;border:2px solid;white-space:nowrap}
#badge.replay{color:var(--amb);border-color:var(--amb);background:#2a2300}
#badge.live{color:var(--grn);border-color:var(--grn);background:#00331a}
#badge.wait{color:var(--cyn);border-color:var(--cyn);background:#00262b}
#badge.live::before{content:"";display:inline-block;width:.5em;height:.5em;border-radius:50%;background:var(--grn);margin-right:.5em;animation:pulse 1.2s infinite}
#stage{position:relative;min-height:0;display:flex;flex-direction:column;gap:1.4vh;overflow:hidden}
h1{font-size:var(--head);line-height:1.04;margin:0;font-weight:800;letter-spacing:-.01em}
.sub{color:var(--dim)}
.card{border:2px solid var(--line);border-radius:14px;background:var(--card);padding:1.1vh 1.4vw;min-height:0}
.label{color:var(--dim);font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.mono{font-family:var(--mono)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:1.6vw;min-height:0}
.cols.wide{grid-template-columns:1.15fr .85fr}
.hide{opacity:0;transform:translateY(10px)}
.in{opacity:1;transform:none;transition:opacity .5s ease,transform .5s ease}
.dim{color:var(--dim)}
.ok{color:var(--grn)} .bad{color:var(--red);font-weight:700} .warn{color:var(--amb)}
.tag{font-family:var(--mono);color:var(--cyn);font-weight:700}

/* title / closer */
.center{flex:1;display:flex;flex-direction:column;justify-content:center;gap:2.2vh}
.center h1{font-size:calc(var(--head)*1.45)}
.center .sub{font-size:calc(var(--body)*1.25)}
.url{font-family:var(--mono);color:var(--cyn);font-size:calc(var(--body)*1.2)}

/* staff + seance */
.msg .meta{display:grid;grid-template-columns:auto 1fr;gap:0 1.2vw;margin-bottom:1vh}
.msg .meta b{color:var(--dim);font-weight:600}
.body{white-space:pre-wrap;overflow-wrap:anywhere}
.more{color:var(--dim);text-decoration:underline;margin-top:.5vh}
.ghost{display:block;margin:.3vh 0}
.ghost .gl{display:inline-block;background:var(--mag);color:#000;font-weight:800;padding:0 .5em;letter-spacing:.04em}
.ghost .gt{display:block;background:var(--mag);color:#000;font-weight:700;padding:.1em .5em;box-shadow:0 0 28px 4px rgba(255,61,240,.55)}
.ghost .gs{display:block;color:#ffb3f8;font-weight:700;margin-top:.2vh}
.mark{background:var(--mag);color:#000;font-weight:800;padding:0 .3em}
#ptitle{transition:color .4s}
#ptitle.glow{color:var(--mag)}
.headrow{display:flex;flex-wrap:wrap;align-items:baseline;column-gap:1.4vw;margin-bottom:.2vh}
.taglabel{color:var(--mag);font-weight:700}

/* trace + draft */
.row{padding:.5vh 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.call{font-family:var(--mono);font-weight:700;overflow-wrap:anywhere}
.verdictline{margin-top:.6vh;font-weight:800}
.draft .line{margin:0 0 .5vh;overflow-wrap:anywhere}
.draft .ell{color:var(--dim)}
.hl{border-radius:4px;transition:background .5s,color .5s}
.draft.lit .hl.phone{background:var(--red);color:#fff;font-weight:800}
.draft.lit .hl.leak{background:var(--amb);color:#000;font-weight:800}
.jsonbox{font-family:var(--mono);color:var(--grn);white-space:pre-wrap;overflow-wrap:anywhere}
.note{margin-top:.6vh}

/* meter overlay: it slams over the stage, so it never changes the layout underneath */
.meter{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2vh;
  background:rgba(6,6,10,.97);opacity:0;pointer-events:none;transition:opacity .25s;text-align:center;padding:0 2vw}
.meter.in{opacity:1;transform:none}
.track{display:flex;gap:1vw;width:70%}
.track i{flex:1;height:1.6vh;min-height:12px;border-radius:6px;background:var(--line)}
.word{font-size:calc(var(--head)*1.7);font-weight:900;letter-spacing:.05em;line-height:1;opacity:0;transform:scale(3)}
.meter.in .word{animation:slam .45s cubic-bezier(.2,1.3,.4,1) forwards}
.lvl-still .word{color:var(--grn)} .lvl-whispering .word{color:var(--amb)} .lvl-possessed .word{color:var(--red)}
.mcap{font-weight:800}
.reasons{display:flex;flex-direction:column;gap:.4vh;align-items:flex-start;max-width:92%}
.reasons div{opacity:0}
.reasons div.in{opacity:1}
.reasons .r{color:var(--red);font-weight:700} .reasons .y{color:var(--amb);font-weight:700}

/* why */
.boxes{display:flex;align-items:stretch;gap:1.2vw;flex:1;min-height:0}
.box{flex:1;display:flex;flex-direction:column;justify-content:center;gap:1vh;padding:2vh 1.4vw;border-radius:16px;border:2px solid var(--cyn);background:var(--card)}
.box b{font-size:calc(var(--body)*1.1);color:var(--cyn)}
.arrow{align-self:center;color:var(--mag);font-size:calc(var(--head)*.8);font-weight:900}
.foot{color:var(--amb);font-weight:800}

/* backup video */
#video{position:fixed;inset:0;background:#000;display:none;z-index:9}
#video video{width:100%;height:100%;object-fit:contain}

/* ---------- presenter ---------- */
body.presenter #frame{display:none}
#presenter{display:none}
body.presenter #presenter{position:fixed;inset:0;display:grid;grid-template-columns:1.7fr 1fr;gap:2vw;padding:2.4vh 2vw;font-size:20px;overflow:auto}
body.presenter, body.presenter html{overflow:auto}
#pl{display:flex;flex-direction:column;gap:2vh;min-width:0}
#p-kick{color:var(--mag);font-weight:800;letter-spacing:.06em;font-size:1.1em;text-transform:uppercase}
#p-say{font-size:clamp(30px,3.4vw,58px);line-height:1.22;font-weight:700}
#p-next{color:var(--dim);font-size:1.15em}
#p-warn{display:flex;flex-direction:column;gap:1vh}
.warnbox{background:#2a2300;border:2px solid var(--amb);color:var(--amb);border-radius:10px;padding:1.2vh 1vw;font-weight:700}
.infobox{background:#0f1f2b;border:2px solid var(--cyn);color:var(--cyn);border-radius:10px;padding:1.2vh 1vw;font-weight:600}
#pr{display:flex;flex-direction:column;gap:1.6vh;min-width:0}
.timers{display:flex;gap:1.4vw}
.timers div{flex:1;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:.8vh 1vw}
.timers b{display:block;font-size:2em;font-family:var(--mono)}
.btns{display:flex;flex-wrap:wrap;gap:.8vw}
button{font:inherit;font-weight:700;color:var(--fg);background:#1d1d2b;border:2px solid var(--line);border-radius:10px;padding:.7vh 1.1vw;cursor:pointer}
button:hover{border-color:var(--mag)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.5vh}
.steps li{padding:.6vh .8vw;border-radius:8px;border:2px solid transparent;cursor:pointer;color:var(--dim)}
.steps li.cur{border-color:var(--mag);color:var(--fg);font-weight:800}
.pills{display:flex;flex-direction:column;gap:.6vh}
.pill{padding:.5vh .8vw;border-radius:8px;font-weight:600}
.pill small{display:block;font-weight:400;opacity:.85}
.pill.ok{background:#00331a;color:var(--grn)} .pill.fail{background:#3a0a14;color:var(--red)} .pill.skip{background:#22222e;color:var(--dim)}
.keys{color:var(--dim);font-size:.85em}
h2{margin:0 0 .6vh;font-size:1em;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}

@keyframes slam{0%{opacity:0;transform:scale(3)}60%{opacity:1;transform:scale(.94)}100%{opacity:1;transform:scale(1)}}
@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.in,.hide{transition:none}}
.final *,.final .in,.final .hide{transition:none!important}
.final .meter.in .word{animation-duration:0s!important}
</style>
</head>
<body>
<div id="frame">
  <div id="top"><div id="dots"></div><div id="badge" class="replay">REPLAY</div></div>
  <div id="stage"></div>
</div>
<div id="presenter">
  <section id="pl">
    <div id="p-kick"></div>
    <div id="p-say"></div>
    <div id="p-next"></div>
    <div id="p-warn"></div>
  </section>
  <aside id="pr">
    <div class="timers"><div>step<b id="t-step">0:00</b></div><div>demo<b id="t-demo">0:00</b></div></div>
    <div class="btns">
      <button data-act="back">← Back</button><button data-act="next">Next →</button>
      <button data-act="rerun">R Rerun</button><button data-act="toggle_mode" id="b-mode">L Live / Replay</button>
    </div>
    <div><h2>Steps</h2><ol class="steps" id="p-steps"></ol></div>
    <div><h2>Sources</h2><div class="pills" id="p-sources"></div></div>
    <div><h2>Preflight</h2><div class="pills" id="p-pre"></div></div>
    <div class="keys">→ Space PgDn next · ← PgUp back · R rerun · L live/replay · F fullscreen · B backup video</div>
  </aside>
</div>
<div id="video"></div>

<script>
"use strict";
const Q = new URLSearchParams(location.search);
const AUTOPLAY = Q.get("autoplay") === "1";
const STEP_MS = Math.max(500, parseInt(Q.get("step_ms"), 10) || 6000);
const PRESENTER = location.pathname.replace(/\/+$/, "") === "/presenter";
// ?step=N pins the step on this screen only; &final=1 skips every animation (for screenshots and layout checks)
let FORCE_STEP = Q.get("step") !== null && /^\d+$/.test(Q.get("step")) ? parseInt(Q.get("step"), 10) : null;
const FINAL = Q.get("final") === "1";
if (FINAL) document.documentElement.classList.add("final");
const $ = (s) => document.querySelector(s);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

let S = null, V = null, offset = 0, timers = [], autoTimer = null, lastWarnKey = "";
const at = (ms, fn) => timers.push(setTimeout(fn, FINAL ? 0 : ms));
const clearTimers = () => { timers.forEach(clearTimeout); timers = []; };
const reveal = (node) => node && node.classList.add("in");

/* ------------------------------------------------------------------ data */
async function getJSON(url) { const r = await fetch(url, { cache: "no-store" }); return r.json(); }

async function poll() {
  try {
    const next = await getJSON("/api/state");
    if (FORCE_STEP !== null) next.step = Math.min(next.n - 1, FORCE_STEP);
    offset = next.server_time * 1000 - Date.now();
    const viewsChanged = !V || !S || next.views_version !== S.views_version;
    const redraw = !S || next.step !== S.step || next.epoch !== S.epoch || viewsChanged;
    S = next;
    if (viewsChanged) V = await getJSON("/api/views");
    if (redraw) render();
    chrome();
  } catch (e) { /* the server hiccuped: keep the last screen */ }
}

async function act(action, arg) {
  if (AUTOPLAY) return localAct(action);
  try {
    await fetch("/api/action", { method: "POST", headers: { "Content-Type": "application/json" },
                                 body: JSON.stringify({ action, arg }) });
  } catch (e) { /* ignore */ }
  poll();
}

/* ---------------------------------------------------------------- autoplay (local, replay only, fixed timing) */
async function startAutoplay() {
  const first = await getJSON("/api/state");
  V = await getJSON("/api/replay");
  S = { step: 0, epoch: 1, n: first.n, steps: first.steps, mode: "replay", replay_only: true, backup: false,
        runs: { "0": { source: "replay", badge: V.runs["0"].badge }, "1": { source: "replay", badge: V.runs["1"].badge } },
        preflight: [], step_started: Date.now() / 1000, demo_started: null, server_time: Date.now() / 1000 };
  render(); chrome(); scheduleNext();
}
function scheduleNext() {
  clearTimeout(autoTimer);
  const step = S.steps[S.step];
  if (S.step >= S.n - 1) return;
  autoTimer = setTimeout(() => localAct("next"), Math.max(STEP_MS, step.min_ms));
}
function localAct(action) {
  const before = S.step;
  if (action === "next") S.step = Math.min(S.n - 1, S.step + 1);
  else if (action === "back") S.step = Math.max(0, S.step - 1);
  if (S.step !== before || action === "rerun") { S.epoch++; S.step_started = Date.now() / 1000; render(); chrome(); scheduleNext(); }
}

/* --------------------------------------------------------------- drawing */
function runFor(guard) { return V && V.runs && V.runs[String(guard)]; }

function drawStep() {
  clearTimers();
  const stage = $("#stage");
  stage.replaceChildren();
  const step = S.steps[S.step];
  if (V && V.replay_error && S.step >= 1) {
    stage.append(el("h1", null, "Saved runs missing"), el("div", "sub", V.replay_error));
    return;
  }
  (DRAW[step.id] || (() => {}))(stage, step);
}

function render() {
  const dots = $("#dots");
  dots.replaceChildren(...S.steps.map((_, i) => el("i", i === S.step ? "on" : "")));
  drawStep();
  presenterRender();
}

function chrome() {
  const guard = S.step >= 4 ? "1" : "0";
  const b = (S.runs[guard] || {}).badge || { source: "replay", text: "REPLAY" };
  const badge = $("#badge");
  badge.textContent = b.text;
  badge.className = b.source === "live" ? "live" : b.source === "wait" ? "wait" : "replay";
  updateWait();
  presenterTick();
}

/* ---- shared pieces ---- */
function stage_h1(stage, step) { stage.append(el("h1", null, step.headline)); }

/* A live run still inside its timeout: say so and count. It is never shown as a replay, and never waits past its limit. */
function waitScreen(stage, guard) {
  const st = S.runs[guard];
  if (!st || st.source !== "wait") return false;
  const box = el("div", "center");
  box.append(el("h1", null, "Waiting for the live run…"));
  const line = el("div", "sub");
  line.id = "waitline";
  box.append(line);
  stage.append(box);
  updateWait();
  return true;
}
function updateWait() {
  const line = $("#waitline");
  if (!line || !S) return;
  const w = (S.runs[S.step >= 4 ? "1" : "0"] || {}).wait;
  if (w) line.textContent = "Gemma 4 is working: " + Math.floor(w.elapsed) + " s of up to " + w.timeout +
    " s. After that, the saved real run takes over and says so.";
}
function noRun(stage) { stage.append(el("div", "sub", "No run to show.")); }

function staffCard(m) {
  const card = el("div", "card msg");
  const meta = el("div", "meta");
  [["From", m.from], ["Subject", m.subject], ["Received", m.received]].forEach(([k, v]) => {
    meta.append(el("b", null, k), el("span", null, v));
  });
  card.append(meta, el("div", "body", m.staff.body));
  if (m.staff.folded) card.append(el("div", "more", "… show more"));
  return card;
}

function traceCard(run, delay0) {
  const card = el("div", "card");
  card.append(el("div", "label", "Agent trace"));
  const rows = run.trace.rows.map((r) => {
    const row = el("div", "row hide");
    row.append(el("div", "call", r.call));
    const t = el("div", "touch");
    r.touched.forEach((x) => t.append(el("span", x.kind === "foreign" ? "bad" : x.kind === "sender" ? "ok" : "", x.text + "  ")));
    if (!r.allowed) t.append(el("span", "bad", "refused  "));
    if (r.note) t.append(el("span", "dim", r.note));
    row.append(t);
    card.append(row);
    return row;
  });
  const verdict = el("div", "verdictline hide " + (run.trace.verdict.ok ? "ok" : "bad"), (run.trace.verdict.ok ? "✓ " : "✗ ") + run.trace.verdict.text);
  card.append(verdict);
  rows.forEach((row, i) => at(delay0 + 900 * i, () => reveal(row)));
  const done = delay0 + 900 * rows.length;
  at(done, () => reveal(verdict));
  return { card, done: done + 500 };
}

/* GUARD=1: what the code did, as short green lines (the model had no tools to show here) */
function codeCard(run, delay0, note) {
  const card = el("div", "card");
  card.append(el("div", "label", "Code, not the model"));
  const seen = new Set(), items = [];
  run.trace.rows.forEach((r) => r.touched.forEach((t) => { if (!seen.has(t.text)) { seen.add(t.text); items.push(t); } }));
  const rows = items.map((t) => {
    const row = el("div", "row hide " + (t.kind === "foreign" ? "bad" : t.kind === "sender" ? "ok" : ""),
                   (t.kind === "foreign" ? "✗ " : "✓ ") + t.text);
    card.append(row);
    return row;
  });
  const line = el("div", "note hide dim", note);
  card.append(line);
  rows.forEach((row, i) => at(delay0 + 900 * i, () => reveal(row)));
  const done = delay0 + 900 * rows.length;
  at(done, () => reveal(line));
  return { card, done: done + 500 };
}

function draftCard(run, label) {
  const d = run.draft;
  const card = el("div", "card draft hide");
  card.append(el("div", "label", label));
  if (!d) { card.append(el("div", "dim", run.held || run.urgent || run.error || "No draft was written.")); return card; }
  (d.short || d.excerpt).forEach((ln) => {
    const p = el("div", "line mono" + (ln.ellipsis ? " ell" : ""));
    ln.segs.forEach((sg) => p.append(sg.hl ? el("span", "hl " + sg.hl, sg.s) : document.createTextNode(sg.s)));
    card.append(p);
  });
  return card;
}

function meterOverlay(run) {
  const m = run.meter;
  const box = el("div", "meter");
  if (!m) { box.append(el("div", "mcap dim", "No verdict yet.")); return { box, lines: [] }; }
  box.classList.add("lvl-" + m.level);
  const levels = ["still", "whispering", "possessed"];
  const track = el("div", "track");
  const colors = { still: "var(--grn)", whispering: "var(--amb)", possessed: "var(--red)" };
  levels.forEach((lv, i) => { const seg = el("i"); if (i <= levels.indexOf(m.level)) seg.style.background = colors[lv]; track.append(seg); });
  box.append(track, el("div", "word", m.level.toUpperCase()), el("div", "mcap", m.caption));
  const reasons = el("div", "reasons");
  const lines = [];
  m.leak.concat(m.phishing).forEach((t) => lines.push(el("div", "r", "✗ " + t)));
  if (m.level === "whispering") m.evidence.forEach((t) => lines.push(el("div", "y", "▸ caught: " + t)));
  lines.forEach((l) => reasons.append(l));
  box.append(reasons);
  return { box, lines };
}

/* ---- the steps ---- */
const DRAW = {
  title(stage, step) {
    const c = el("div", "center");
    const liveNow = !AUTOPLAY && S.mode === "live" && !S.replay_only;  // never claim a live model when it is not running
    c.append(el("h1", null, step.headline), el("div", "sub", step.sub),
             el("div", "foot", liveNow ? step.foot : step.foot_replay));
    stage.append(c);
  },

  hook(stage, step) {
    stage_h1(stage, step);
    const m = V && V.message;
    if (m) stage.append(staffCard(m));
    stage.append(el("div", "dim", step.caption));
  },

  reveal(stage, step) {
    stage_h1(stage, step);
    const m = V && V.message;
    if (!m) return;
    const card = el("div", "card msg");
    const head = el("div", "headrow");
    const title = el("span", "label", "What staff see");
    title.id = "ptitle";
    const cap = el("span", "taglabel hide", step.caption);
    head.append(title, cap);
    card.append(head);
    const body = el("div", "body");
    const ghosts = [];
    m.seance.forEach((sg) => {
      if (sg.t === "text") body.append(document.createTextNode(sg.s));
      else if (sg.t === "break") body.append(document.createTextNode("\n"));
      else if (sg.t === "mark") { const k = el("span", "mark hide", "⟨" + sg.s + "⟩"); body.append(k); ghosts.push(k); }
      else {
        const g = el("div", "ghost hide");
        g.append(el("span", "gl", sg.label), el("span", "gt", sg.s));
        if (sg.signals.length) g.append(el("span", "gs", "→ contains " + sg.signals.join(", ")));
        body.append(g); ghosts.push(g);
      }
    });
    card.append(body);
    stage.append(card);
    at(1200, () => { title.textContent = "What the AI reads"; title.classList.add("glow"); reveal(cap); });
    ghosts.forEach((g, i) => at(1300 + 900 * i, () => reveal(g)));
  },

  possessed(stage, step) {
    stage_h1(stage, step);
    if (waitScreen(stage, "0")) return;
    const run = runFor(0);
    if (!run) return noRun(stage);
    const cols = el("div", "cols");
    const trace = traceCard(run, 500);
    const draft = draftCard(run, "Draft reply");
    cols.append(trace.card, draft);
    stage.append(cols);
    const meter = meterOverlay(run);
    stage.append(meter.box);
    const tDraft = trace.done + 300;
    at(tDraft, () => reveal(draft));
    at(tDraft + 1000, () => draft.classList.add("lit"));
    const tMeter = tDraft + 2600;
    at(tMeter, () => reveal(meter.box));
    meter.lines.forEach((l, i) => at(tMeter + 800 + 450 * i, () => reveal(l)));
  },

  whispering(stage, step) {
    stage_h1(stage, step);
    if (waitScreen(stage, "1")) return;
    const run = runFor(1);
    if (!run) return noRun(stage);
    const jbox = el("div", "card hide");
    jbox.append(el("div", "label", "The model's only output"));
    const j = run.intent ? JSON.stringify(run.intent) : "(no output)";
    jbox.append(el("div", "jsonbox", j));
    stage.append(jbox);
    const cols = el("div", "cols");
    const trace = codeCard(run, 1900, step.code_note);
    const draft = draftCard(run, "Reply from the hospital template");
    cols.append(trace.card, draft);
    stage.append(cols);
    const meter = meterOverlay(run);
    stage.append(meter.box);
    at(300, () => reveal(jbox));
    const tDraft = trace.done + 700;
    at(tDraft, () => reveal(draft));
    const tMeter = tDraft + 2200;
    at(tMeter, () => reveal(meter.box));
    meter.lines.forEach((l, i) => at(tMeter + 800 + 450 * i, () => reveal(l)));
  },

  why(stage, step) {
    stage_h1(stage, step);
    stage.append(el("div", "sub", step.sub));
    const wrap = el("div", "boxes");
    const items = [];
    step.boxes.forEach((b, i) => {
      if (i) { const a = el("div", "arrow hide", "→"); wrap.append(a); items.push(a); }
      const box = el("div", "box hide");
      box.append(el("b", null, b.title), el("span", null, b.body));
      wrap.append(box); items.push(box);
    });
    stage.append(wrap, el("div", "foot", step.foot));
    items.forEach((n, i) => at(400 + 700 * i, () => reveal(n)));
  },

  closer(stage, step) {
    const c = el("div", "center");
    c.append(el("h1", null, step.headline), el("div", "url", step.sub), el("div", "sub", step.foot));
    stage.append(c);
  },
};

/* ------------------------------------------------------------- presenter */
function mmss(sec) { sec = Math.max(0, Math.floor(sec)); return Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2, "0"); }

function presenterRender() {
  if (!PRESENTER || !S) return;
  const step = S.steps[S.step], next = S.steps[S.step + 1];
  $("#p-kick").textContent = "Step " + S.step + " of " + (S.n - 1) + " · " + step.name;
  $("#p-say").textContent = step.say;
  $("#p-next").textContent = next ? "Next: " + next.name + " — " + next.say : "That's the last step.";
  const list = $("#p-steps");
  list.replaceChildren(...S.steps.map((st, i) => {
    const li = el("li", i === S.step ? "cur" : "", i + ". " + st.name);
    li.onclick = () => act("goto", i);
    return li;
  }));
}

function presenterTick() {
  if (!PRESENTER || !S) return;
  const now = (Date.now() + offset) / 1000;
  $("#t-step").textContent = mmss(now - S.step_started);
  $("#t-demo").textContent = S.demo_started ? mmss(now - S.demo_started) : "0:00";
  // rebuild the warnings only when they change, so the "Use replay" button is not replaced under the mouse
  const specs = [];
  ["0", "1"].forEach((g) => {
    const r = S.runs[g] || {};
    if (r.warning) specs.push(["warnbox", "GUARD=" + g + ": " + r.warning, true]);
    if (r.source === "wait") specs.push(["infobox", "GUARD=" + g + ": waiting for the live run (" + Math.floor((r.wait || {}).elapsed || 0) + " s of " + ((r.wait || {}).timeout || "?") + " s)", true]);
    else if (r.reason) specs.push(["infobox", "GUARD=" + g + " is showing the replay: " + r.reason, false]);
  });
  if (S.note) specs.push(["infobox", S.note, false]);
  const key = JSON.stringify(specs);
  if (key !== lastWarnKey) {
    lastWarnKey = key;
    $("#p-warn").replaceChildren(...specs.map(([cls, text, button]) => {
      const box = el("div", cls, text);
      if (button) {
        const b = el("button", null, "Use replay (L)");
        b.onclick = () => act("toggle_mode");
        box.append(document.createElement("br"), b);
      }
      return box;
    }));
  }
  $("#p-sources").replaceChildren(...["0", "1"].map((g) => {
    const r = S.runs[g] || {};
    const live = r.badge && r.badge.source === "live";
    const p = el("div", "pill " + (live ? "ok" : "skip"), "GUARD=" + g + " · " + ((r.badge || {}).text || ""));
    return p;
  }));
  $("#p-pre").replaceChildren(...(S.preflight || []).map((c) => {
    const p = el("div", "pill " + c.state, c.label);
    p.append(el("small", null, c.detail));
    return p;
  }));
  $("#b-mode").textContent = S.replay_only ? "L Replay-only" : "L " + (S.mode === "live" ? "Live → Replay" : "Replay → Live");
}

/* ------------------------------------------------------------------ keys */
function backupVideo() {
  const box = $("#video");
  if (box.style.display === "block") { box.replaceChildren(); box.style.display = "none"; return; }
  if (!S || !S.backup) return;
  const v = document.createElement("video");
  v.src = "/backup.mp4"; v.autoplay = true; v.controls = false;
  box.replaceChildren(v); box.style.display = "block";
}

document.addEventListener("keydown", (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key;
  if (k === "ArrowRight" || k === " " || k === "PageDown") act("next");
  else if (k === "ArrowLeft" || k === "PageUp") act("back");
  else if (k === "r" || k === "R") act("rerun");
  else if (k === "l" || k === "L") act("toggle_mode");
  else if (k === "f" || k === "F") { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {}); }
  else if (k === "b" || k === "B" || (k === "Escape" && $("#video").style.display === "block")) backupVideo();
  else return;
  e.preventDefault();
});
document.querySelectorAll("button[data-act]").forEach((b) => b.addEventListener("click", () => act(b.dataset.act)));

if (FINAL) window.__go = (n) => { FORCE_STEP = n; return poll(); };  // layout checks only: jump to a step
if (PRESENTER) document.body.classList.add("presenter");
if (AUTOPLAY && !PRESENTER) startAutoplay();
else { poll(); setInterval(poll, 300); setInterval(presenterTick, 250); }
</script>
</body>
